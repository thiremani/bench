name: Linux Benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_BIN: /usr/lib/llvm-22/bin
      LLVM_CONFIG: /usr/lib/llvm-22/bin/llvm-config
      CC_BIN: /usr/lib/llvm-22/bin/clang
      CXX_BIN: /usr/lib/llvm-22/bin/clang++

    steps:
      - name: Checkout bench
        uses: actions/checkout@v4

      # Fail quickly on scrubber, snapshot-writer, and summary-schema drift.
      - name: Check snapshot contract
        run: python3 scripts/test_snapshot.py

      - name: Checkout Pluto
        uses: actions/checkout@v4
        with:
          repository: thiremani/pluto
          path: pluto
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: pluto/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.94.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.5"

      - name: Install Python benchmark deps
        run: |
          python3 -m pip install --break-system-packages --user numpy==2.4.4

      - name: Install LLVM 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            git \
            gnupg2 \
            libc6-dev \
            libcurl4-openssl-dev \
            libedit2 \
            libgcc-13-dev \
            libncurses-dev \
            libpython3-dev \
            libsqlite3-0 \
            libstdc++-13-dev \
            libxml2-dev \
            libz3-dev \
            luajit \
            pkg-config \
            tzdata \
            unzip \
            zip \
            zlib1g-dev \
            llvm-22-dev \
            lld-22 \
            clang-22
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++-22 100

      - name: Set LLVM environment
        run: |
          cd pluto
          python3 scripts/llvm_env.py --github-actions

      - name: Install Swift 6.2.4
        run: |
          SWIFT_VERSION=6.2.4
          SWIFT_PLATFORM=ubuntu24.04
          SWIFT_ARCHIVE=swift-${SWIFT_VERSION}-RELEASE-${SWIFT_PLATFORM}.tar.gz
          SWIFT_URL=https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/${SWIFT_ARCHIVE}

          wget -q "${SWIFT_URL}"
          tar xzf "${SWIFT_ARCHIVE}"
          echo "${PWD}/swift-${SWIFT_VERSION}-RELEASE-${SWIFT_PLATFORM}/usr/bin" >> "$GITHUB_PATH"

      - name: Install Zig 0.15.2
        run: |
          ZIG_VERSION=0.15.2
          ZIG_ARCHIVE=zig-x86_64-linux-${ZIG_VERSION}.tar.xz
          ZIG_URL=https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}

          wget -q "${ZIG_URL}"
          tar xf "${ZIG_ARCHIVE}"
          echo "${PWD}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Reassert LLVM 22 toolchain precedence
        run: |
          # Swift ships its own clang/lld; keep the benchmark and Pluto build on
          # the same LLVM toolchain we installed above.
          echo "$LLVM_BIN" >> "$GITHUB_PATH"

      - name: Build Pluto
        working-directory: pluto
        run: python3 build.py -o pluto

      - name: Verify toolchain
        run: |
          python3 --version
          python3 -c "import numpy as np; print(f'NumPy {np.__version__}')"
          "$CC_BIN" --version | head -n 1
          "$CXX_BIN" --version | head -n 1
          swift --version
          swiftc --version
          go version
          rustc --version
          zig version
          luajit -v
          node --version
          bun --version
          julia --version
          pluto/pluto -version
          which clang
          clang --version | head -n 1
          which ld.lld
          ld.lld --version | head -n 1
          which opt
          opt --version | head -n 1
          which llc
          llc --version | head -n 1

      - name: Run Linux benchmark suite
        run: |
          python3 -u scripts/benchmark.py \
            --repeat 10 \
            --warmup-runs 5 \
            --pluto pluto/pluto \
            --snapshot-dir results/linux-gha

      # Checks the snapshot just generated, plus the scrubber itself. The
      # published job summary and artifact both come from this file.
      - name: Check generated snapshot contract
        run: python3 scripts/test_snapshot.py results/linux-gha/results.json

      - name: Write job summary
        run: python3 scripts/render_summary.py results/linux-gha/results.json

      - name: Upload Linux benchmark snapshot
        uses: actions/upload-artifact@v4
        with:
          name: linux-benchmark-snapshot
          path: results/linux-gha
